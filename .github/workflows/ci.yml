name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install aria2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2

      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        run: winget install aria2.aria2 || true

      - name: Restore dependencies
        run: dotnet restore src/AriaSharp.slnx

      - name: Build solution
        run: dotnet build src/AriaSharp.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test src/AriaSharp.slnx -c Release

      - name: Publish AOT
        run: dotnet publish src/AriaSharp.Console/AriaSharp.Console.csproj -c Release -r ${{ matrix.rid }}

      - name: Report binary size
        shell: bash
        run: |
          dir=./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$dir/ariasharp.exe"; else bin="$dir/ariasharp"; fi
          line="ariasharp ${{ matrix.rid }}: $(wc -c < "$bin") bytes"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Binary size::$line"
          ls -l "$dir"

      - name: Smoke test --version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp.exe --version
          else
            ./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp --version
          fi

      - name: Smoke test --help
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp.exe --help
          else
            ./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp --help
          fi

      - name: Smoke test --install-deps -y and --doctor
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp.exe
          else
            BIN=./src/AriaSharp.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/ariasharp
          fi
          "$BIN" --install-deps -y
          out=$("$BIN" --doctor)
          status=$?
          echo "$out"
          test "$status" -eq 0
          echo "$out" | grep -q 'HTTPS: yes'

  installer-windows:
    name: install.ps1 (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run install.ps1 via irm | iex (Windows PowerShell 5.1)
        shell: powershell
        env:
          ARIASHARP_INSTALL_DIR: ${{ runner.temp }}\ariasharp-ps51
        run: |
          $PSVersionTable.PSVersion
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          & (Join-Path $env:ARIASHARP_INSTALL_DIR 'ariasharp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "ariasharp --version failed ($LASTEXITCODE)" }

      - name: Run install.ps1 via irm | iex (PowerShell 7)
        shell: pwsh
        env:
          ARIASHARP_INSTALL_DIR: ${{ runner.temp }}\ariasharp-ps7
        run: |
          $PSVersionTable.PSVersion
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          & (Join-Path $env:ARIASHARP_INSTALL_DIR 'ariasharp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "ariasharp --version failed ($LASTEXITCODE)" }

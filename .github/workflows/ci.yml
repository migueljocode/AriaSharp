name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AriaSharp.sln

      - name: Build solution
        run: dotnet build AriaSharp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/AriaSharp.Tests/AriaSharp.Tests.csproj --configuration Release --no-build --verbosity normal

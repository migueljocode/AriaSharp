name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AriaSharp.slnx

      - name: Build solution
        run: dotnet build AriaSharp.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/AriaSharp.Tests/AriaSharp.Tests.csproj --configuration Release --verbosity normal

      - name: Publish AOT (linux-x64)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/AriaSharp.Console/AriaSharp.Console.csproj -c Release -r linux-x64 --self-contained false

      - name: Smoke test --version
        if: matrix.os == 'ubuntu-latest'
        run: src/AriaSharp.Console/bin/Release/net10.0/linux-x64/publish/ariasharp --version
